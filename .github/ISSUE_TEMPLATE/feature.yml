name: 기능
description: 스펙의 수용 기준 묶음 하나를 구현한다
title: "기능 이름"
labels: ["feat"]
body:
  - type: input
    id: spec
    attributes:
      label: 스펙
      placeholder: SPEC-000
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 이 이슈의 수용 기준
      description: 스펙에서 이 이슈가 맡는 AC 만 옮긴다.
      value: |
        - [ ] AC-1  (자동)
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 테스트 계획
      description: 자동 테스트로 확인할 것, QA 체크리스트로 넘길 것
      value: |
        - 자동:
        - 수동 QA:
  - type: textarea
    id: notes
    attributes:
      label: 구현 메모
      description: 의존 이슈, 위험 요소, 참고 링크
