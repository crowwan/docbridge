name: 디자인
description: 토큰, 컴포넌트 모양, 모션 조정
title: "디자인 요약"
labels: ["design"]
body:
  - type: textarea
    id: what
    attributes:
      label: 바꿀 것
      description: 어떤 토큰, 컴포넌트, 모션을 왜 바꾸나
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: 관련 스펙
      placeholder: SPEC-000 (없으면 비움)
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      value: |
        - [ ] 토큰 파일에 반영 (값을 컴포넌트에 직접 쓰지 않음)
        - [ ] 디자인 카탈로그에서 모든 상태 확인 (라이트/다크 포함)
        - [ ] PR 에 변경 전/후 카탈로그 스크린샷
        - [ ] 의도가 바뀌었으면 docs/design.md 갱신
    validations:
      required: true
